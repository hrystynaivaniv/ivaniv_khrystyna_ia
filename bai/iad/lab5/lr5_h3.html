    geo_json_5b6212dafde342ea060fbd611fda7ead.bindTooltip(
    function(layer){
    let div = L.DomUtil.create('div');
    
    let handleObject = feature => {
        if (feature === null) {
            return '';
        } else if (typeof(feature)=='object') {
            return JSON.stringify(feature);
        } else {
            return feature;
        }
    }
    let fields = ["h3", "n"];
    let aliases = ["h3", "n"];
    let table = '<table>' +
        String(
        fields.map(
        (v,i)=>
        `<tr>
            <th>${aliases[i]}</th>
            
            <td>${handleObject(layer.feature.properties[v])}</td>
        </tr>`).join(''))
    +'</table>';
    div.innerHTML=table;
    
    return div
    }

            return '';

            return JSON.stringify(feature);

    }

    let aliases = ["name"];

        </tr>`).join(''))
    +'</table>';
    div.innerHTML=table;
    
    return div
    }
